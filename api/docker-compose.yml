# Base de datos local para desarrollo — Cáritas de Monterrey, A.B.P.
#
# Levanta SQL Server (Azure SQL Edge, mismo motor T-SQL) en Docker.
# En Mac con chip Apple (arm64) esta imagen corre NATIVA, sin emulación:
# la imagen normal de SQL Server 2022 no arranca bajo Colima/QEMU.
#
# Uso:
#   docker compose up -d       # levanta la base
#   ./db/cargar.sh             # crea el esquema y carga los datos de prueba
#   docker compose down        # apaga (conserva los datos)
#   docker compose down -v     # apaga y BORRA los datos
#
# Credenciales de la base:  usuario = sa   contraseña = Caritas!2026

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: caritas_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Caritas!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
